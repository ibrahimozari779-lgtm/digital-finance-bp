[pytest]
# Primary, portable pytest suite lives here.
testpaths = tests
python_files = test_*.py

# The top-level test_*.py scripts (test_cross_format_consistency.py,
# test_real_mizan.py, test_eight_engines.py, test_business_partner_engine.py,
# test_workbook_intelligence.py) are legacy regression scripts written against
# the original private source workbooks (real company data, not shipped in
# this package). They are meant to be run manually / one-off, not collected
# by default, since two of them hard-reference absolute sandbox paths that
# do not exist outside the original session. See README.md "Tests" section.
