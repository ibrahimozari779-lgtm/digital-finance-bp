services:
  - type: web
    name: digital-finance-bp
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL: set this to a real Postgres URL (e.g. from a free
      # Supabase project) for login/history to survive redeploys. Without
      # it the app falls back to a local SQLite file on Render's disk,
      # which is wiped on every redeploy -- fine for a first click-through
      # test, NOT fine for real customer data.
      - key: DATABASE_URL
        sync: false
